# Configuración de SonarCloud / SonarQube para LabTrack
sonar.projectKey=Nico-LoRRo_Caso_T3
sonar.organization=nico-lorro
sonar.projectName=Caso_T3 - LabTrack

# Codificación y versión de lenguaje
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12

# Directorios de código fuente a analizar
sonar.sources=labtrack/app

# Pruebas automatizadas
sonar.tests=labtrack
sonar.test.inclusions=**/smoke_test.py,**/test_services.py

# Exclusiones de archivos estáticos y plantillas
sonar.exclusions=**/static/**,**/*.db,**/*.docx,**/.dockerignore

# Exclusión de cobertura para evaluación de análisis estático
sonar.coverage.exclusions=**
